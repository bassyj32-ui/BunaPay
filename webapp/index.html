<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BunaPay</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <h1>BunaPay</h1>
    <p id="rate-line">Loading rate…</p>
  </header>

  <section id="service-section">
    <h2>1. Choose service</h2>
    <div id="service-grid" class="grid"></div>
  </section>

  <section id="amount-section" hidden>
    <h2>2. Amount</h2>
    <div id="amount-chips" class="chips"></div>
    <input id="custom-amount" type="number" inputmode="decimal" min="5" max="100" step="0.01"
           placeholder="Enter USDT amount (5–100)" hidden>
    <p id="amount-summary" class="muted" hidden></p>
  </section>

  <section id="wallet-section" hidden>
    <h2>3. BSC wallet (BEP20)</h2>
    <input id="wallet" type="text" inputmode="text" autocomplete="off" spellcheck="false"
           placeholder="0x… (40 hex characters)">
  </section>

  <p id="error" class="error" hidden></p>

  <button id="submit" type="button" disabled>Place order</button>

  <p id="dev-note" class="muted" hidden>
    You are viewing the page outside Telegram. Open it from the bot chat to place an order.
  </p>

  <script src="app.js"></script>
</body>
</html>
